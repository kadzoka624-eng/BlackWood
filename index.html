<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKWOOD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171719;color:#eee;font-family:monospace;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:14px;left:14px;z-index:3;font-size:11px;letter-spacing:2px;text-shadow:1px 2px #000;pointer-events:none}
#survivalHud{position:fixed;top:42px;left:14px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none;font-family:monospace}
.stat-card{position:relative;width:190px;padding:8px 11px 10px;background:linear-gradient(155deg,rgba(20,22,20,.94),rgba(5,8,8,.91));border:1px solid #8d8b7766;border-left:3px solid #8b8067;box-shadow:0 5px 18px #000b,inset 0 0 16px #c5b58a0a;clip-path:polygon(0 0,96% 0,100% 15%,100% 100%,4% 100%,0 87%);backdrop-filter:blur(4px)}
.stat-card:after{content:"";position:absolute;right:7px;top:6px;width:5px;height:5px;border-radius:50%;background:#9b9278;box-shadow:0 0 7px #b4a27b88}
.stat-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:1.8px;color:#c7c0ad;margin-bottom:7px;text-transform:uppercase}
.stat-value{font-size:10px;color:#d0c8b3;letter-spacing:1px;font-weight:bold}
.bar-track{height:9px;padding:1px;background:#050707;border:1px solid #77715e88;overflow:hidden;clip-path:polygon(0 0,100% 0,98% 100%,2% 100%)}
.bar-fill{height:100%;width:100%;transition:width .16s linear;position:relative}
#staminaFill{background:repeating-linear-gradient(90deg,#7d8d72 0 9px,#303d31 9px 11px);box-shadow:0 0 8px #81916c66}
#sanityFill{background:repeating-linear-gradient(90deg,#a18b63 0 9px,#40372a 9px 11px);box-shadow:0 0 8px #b69b6c66}
#heartIcon{display:inline-block;color:#a2a88a;font-size:14px;line-height:12px;transform-origin:center;animation:heartBeat 1.05s infinite}
#brainIcon{font-size:13px;color:#b4a078}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}58%{transform:scale(1)}}
#crosshair{position:fixed;top:50%;left:50%;width:4px;height:4px;background:white;transform:translate(-50%,-50%);pointer-events:none}
#hint{display:none!important}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse,transparent 55%,#0007 100%)}
#blink{position:fixed;inset:0;z-index:7;background:#000;opacity:0;pointer-events:none}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111216;text-align:center;padding:20px}
#start h1{font-size:clamp(38px,8vw,78px);font-weight:400;letter-spacing:9px;margin:0 0 12px}
#start p{font-size:11px;letter-spacing:2px;color:#aaa;line-height:2}
#loadingStatus{min-height:22px;margin:18px 0 8px;color:#c9c9c9;font-size:12px;letter-spacing:2px;text-shadow:0 0 12px #ffffff33}
#play{display:none;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
#play.ready{display:inline-block;opacity:1;transform:translateY(0)}
#studioCredit{margin-top:16px;color:#777;font-size:10px;letter-spacing:3px;transform-style:preserve-3d;animation:studioSpin 7s linear infinite;text-shadow:0 0 9px #ffffff22}
@keyframes studioSpin{from{transform:perspective(500px) rotateY(0deg)}to{transform:perspective(500px) rotateY(360deg)}}
button{font-family:monospace;color:#fff;background:#24252b;border:1px solid #aaa;touch-action:none;user-select:none;-webkit-user-select:none}
#play{padding:15px 32px;letter-spacing:3px;margin:18px;cursor:pointer}
#mobile{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}
#joystick{position:absolute;left:22px;bottom:28px;width:142px;height:142px;border:2px solid #ffffff75;border-radius:50%;background:#2225;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:43px;top:43px;width:52px;height:52px;border-radius:50%;background:#d0d0d080;border:2px solid #fff9;pointer-events:none}
#rightControls{position:absolute;right:18px;bottom:28px;pointer-events:auto}
#interact{width:70px;height:70px;border-radius:50%;font-size:11px;background:#333d;border:1px solid #ffffffa0}
#flashlightBtn{display:none;width:62px;height:62px;margin:0 4px 12px auto;border-radius:50%;font-size:24px;background:#18202ddd;border:1px solid #dce8ff99;box-shadow:0 0 14px #9bbce633;pointer-events:auto}
#flashlightBtn.on{background:#c5d9f0;color:#101722;box-shadow:0 0 22px #c5d9f088}
#rightControls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#utilityControls{display:flex;flex-direction:row;align-items:center;gap:10px}
#utilityControls #flashlightBtn{margin:0;width:58px;height:58px}
#utilityControls #crouchBtn{width:70px;height:58px}
#crouchBtn{width:70px;height:54px;border-radius:16px;font-size:11px;letter-spacing:1px;background:#252a30dd;border:1px solid #cbd3dc99;box-shadow:0 3px 12px #0008}
#crouchBtn.active{background:#b7c5d0;color:#111;border-color:#fff}
#lookArea{position:absolute;left:43%;right:0;top:0;bottom:0;pointer-events:auto;touch-action:none}
#subtitle{position:fixed;z-index:8;left:50%;bottom:12%;transform:translateX(-50%);width:max-content;max-width:min(88vw,680px);min-height:0;padding:11px 19px;background:linear-gradient(135deg,rgba(8,12,16,.94),rgba(20,25,30,.91));border:1px solid #a9b6c044;border-left:3px solid #aeb8c4;color:#f3f1eb;font-size:14px;line-height:1.65;letter-spacing:.55px;text-align:center;text-shadow:1px 2px 3px #000;box-shadow:0 8px 28px #0008, inset 0 0 18px #ffffff08;backdrop-filter:blur(7px);border-radius:5px;pointer-events:none;opacity:0;transition:opacity .25s}
#subtitle.visible{opacity:1}
#tearOverlay{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;overflow:hidden;transition:opacity 1s}
#tearOverlay.active{opacity:1}
.tear{position:absolute;top:-12%;width:3px;height:24vh;border-radius:0 0 5px 5px;background:linear-gradient(180deg,#9bdcff00,#9bdcffaa,#d8f4ff22);filter:blur(.5px);animation:tearFall 2.4s linear infinite}
.tear:nth-child(1){left:23%;animation-delay:0s}.tear:nth-child(2){left:31%;height:17vh;animation-delay:.7s}.tear:nth-child(3){left:68%;height:22vh;animation-delay:1.1s}.tear:nth-child(4){left:76%;height:16vh;animation-delay:.35s}
@keyframes tearFall{to{transform:translateY(125vh);opacity:.1}}
#mushroomTint{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#70ff9a22 0%,#35d66b18 55%,#153b2c35 100%);mix-blend-mode:screen}
#mushroomTint.active{opacity:1;animation:softHueShift 2.8s linear infinite}
@keyframes softHueShift{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(180deg)}100%{filter:hue-rotate(360deg)}}
#catJumpscare{position:fixed;inset:0;z-index:20;background:#000;display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#catJumpscare.show{display:flex;animation:catFlash .82s steps(2,end) both}
#catJumpscare svg{width:min(92vw,780px);height:94vh;filter:drop-shadow(0 0 34px #8bffb0);transform:translateY(0) scale(1.18)}
#catJumpscare.show svg{animation:catRush .82s cubic-bezier(.12,.78,.18,1) both}
@keyframes catRush{0%{transform:translateY(115vh) scale(.12) rotate(-8deg);filter:drop-shadow(0 0 4px #8bffb0)}48%{transform:translateY(12vh) scale(.82) rotate(4deg)}72%{transform:translateY(-2vh) scale(1.55) rotate(-2deg)}100%{transform:translateY(0) scale(2.15) rotate(0deg);filter:drop-shadow(0 0 48px #baffc8)}}
@keyframes catFlash{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}
#eyelids{position:fixed;inset:0;z-index:9;pointer-events:none;background:transparent;overflow:hidden;opacity:1}
#eyelids::before,#eyelids::after{content:"";position:absolute;left:-4%;width:108%;height:56%;background:#000;will-change:transform;}
#eyelids::before{top:0;border-radius:0 0 48% 48% / 0 0 13% 13%;transform:translateY(-105%)}
#eyelids::after{bottom:0;border-radius:48% 48% 0 0 / 13% 13% 0 0;transform:translateY(105%)}
#eyelids.closed::before{animation:heavyBlinkTop 3.2s cubic-bezier(.42,0,.7,1) forwards}
#eyelids.closed::after{animation:heavyBlinkBottom 3.2s cubic-bezier(.42,0,.7,1) forwards}
@keyframes heavyBlinkTop{0%,9%{transform:translateY(-105%)}17%{transform:translateY(-8%)}23%{transform:translateY(-105%)}34%{transform:translateY(-105%)}45%{transform:translateY(-2%)}53%{transform:translateY(-105%)}67%{transform:translateY(-105%)}82%,100%{transform:translateY(0)}}
@keyframes heavyBlinkBottom{0%,9%{transform:translateY(105%)}17%{transform:translateY(8%)}23%{transform:translateY(105%)}34%{transform:translateY(105%)}45%{transform:translateY(2%)}53%{transform:translateY(105%)}67%{transform:translateY(105%)}82%,100%{transform:translateY(0)}}
.subtitle-char{display:inline-block;opacity:0;animation:letterDrop .16s ease-out forwards}
@keyframes letterDrop{0%{opacity:0;transform:translateY(-13px)}65%{opacity:1;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
@media(pointer:coarse),(max-width:800px){
#mobile{display:block}
#hint{bottom:185px;max-width:90%;white-space:normal;line-height:1.5}
#hud{font-size:10px}
#start h1{letter-spacing:5px}
#subtitle{bottom:13%;font-size:12px;max-width:90vw;padding:9px 13px;line-height:1.55}
}
</style>

<body>

<div id="game"></div>
<div id="hud">BLACKWOOD <span style="color:#ccc">| 01:47 AM</span></div>
<div id="survivalHud" style="display:none">
  <div class="stat-card"><div class="stat-head"><span><span id="heartIcon">♥</span> STAMINA</span><span class="stat-value" id="staminaValue">100%</span></div><div class="bar-track"><div class="bar-fill" id="staminaFill"></div></div></div>
  <div class="stat-card"><div class="stat-head"><span><span id="brainIcon">◉</span> AKIL SAĞLIĞI</span><span class="stat-value" id="sanityValue">100%</span></div><div class="bar-track"><div class="bar-fill" id="sanityFill"></div></div></div>
</div>
<div id="crosshair"></div>
<div id="hint">WASD: HAREKET · MOUSE: BAKIŞ</div>
<div id="vignette"></div>
<div id="mushroomTint"></div>
<div id="blink"></div>
<div id="subtitle"></div>
<div id="tearOverlay"><i class="tear"></i><i class="tear"></i><i class="tear"></i><i class="tear"></i></div>
<div id="eyelids"></div>
<div id="catJumpscare" aria-hidden="true"><svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg"><path fill="#050706" stroke="#17251c" stroke-width="8" d="M72 600Q48 500 105 414L116 250 62 75 190 151Q250 115 310 151L438 75 384 250 395 414Q452 500 428 600Z"/><path fill="#d8ffb2" d="M145 280Q190 225 232 286Q190 330 145 280ZM268 286Q310 225 355 280Q310 330 268 286Z"/><ellipse cx="190" cy="280" rx="12" ry="25" fill="#050706"/><ellipse cx="310" cy="280" rx="12" ry="25" fill="#050706"/><path d="M230 360Q250 380 270 360L250 390Z" fill="#9bff9a"/><path d="M250 390Q220 430 190 405M250 390Q280 430 310 405" fill="none" stroke="#6f9874" stroke-width="9" stroke-linecap="round"/></svg></div>

<div id="mobile">
  <div id="lookArea"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="rightControls"><button id="interact">ETKİLEŞ</button><div id="utilityControls"><button id="crouchBtn" aria-label="Eğil">EĞİL</button><button id="flashlightBtn" aria-label="El fenerini aç" title="El feneri">🔦</button></div></div>
</div>

<div id="start">
  <h1>BLACKWOOD</h1>
  <p>01:47 AM<br>GECE SIRADAN BİR GECEYDİ.</p>
  <div id="loadingStatus" aria-live="polite">Veriler alınıyor...</div>
  <button id="play" type="button">OYNA</button>
  <div id="studioCredit">MADE BY KADIR'S STUDIOS</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const W=480,H=270;
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.domElement.style.width='100vw';
renderer.domElement.style.height='100vh';
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x55535a);
scene.fog=new THREE.Fog(0x55535a,12,25);

const camera=new THREE.PerspectiveCamera(78,W/H,.1,60);
let zoomEnabled=false;
const normalCameraFov=78, zoomCameraFov=34;
camera.rotation.order='YXZ';

function mat(color){
  return new THREE.MeshLambertMaterial({color,flatShading:true});
}

const M={
  wall:mat(0xaaa49a),
  floor:mat(0x756657),
  wood:mat(0x79553a),
  dark:mat(0x403027),
  fabric:mat(0x77777c),
  blanket:mat(0x596779),
  metal:mat(0x85817a),
  curtain:mat(0x565b70),
  carpet:mat(0x827064),
  black:mat(0x17191c)
};

function box(parent,w,h,d,material,x,y,z){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);
  parent.add(mesh);
  return mesh;
}

function group(parent,x=0,y=0,z=0){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  return g;
}

// IŞIKLAR
scene.add(new THREE.HemisphereLight(0xfff1db,0x51483e,2));

const roomLight=new THREE.PointLight(0xffe0b1,2.4,18);
roomLight.position.set(0,2.8,0);
scene.add(roomLight);

const fillLight=new THREE.PointLight(0xffe9d1,1.2,12);
fillLight.position.set(2,2.2,2);
scene.add(fillLight);

const windowLight=new THREE.PointLight(0x9eb8e8,1.1,9);
windowLight.position.set(-3,2,-2);
scene.add(windowLight);

const pcLight=new THREE.PointLight(0x75b5ff,.8,5);
pcLight.position.set(-1.72,1.6,2.75);
scene.add(pcLight);

// ODA
box(scene,8,.15,8,M.floor,0,-.075,0);
box(scene,8,.15,8,M.dark,0,3.15,0);
box(scene,8,3.15,.15,M.wall,0,1.575,-4);
box(scene,.15,3.15,8,M.wall,-4,1.575,0);
box(scene,.15,3.15,8,M.wall,4,1.575,0);
// Kapı duvarı tek düzlemde kurulur. Açıklık yalnızca kapı genişliğindedir.
// Kapı duvarı: iki yan parça kapı kasasına tam birleşir, üst lento açıklığı kapatır.
const doorLeft=-.625, doorRight=.925;
const leftWallWidth=doorLeft-(-4);
const rightWallWidth=4-doorRight;
box(scene,leftWallWidth,3.15,.15,M.wall,(-4+doorLeft)/2,1.575,4);
box(scene,rightWallWidth,3.15,.15,M.wall,(doorRight+4)/2,1.575,4);
box(scene,doorRight-doorLeft,.60,.15,M.wall,(doorLeft+doorRight)/2,2.85,4);

// KAPI
const door=group(scene,.15,0,3.91);
box(door,1.45,2.55,.10,M.dark,0,1.275,0);
box(door,1.30,2.40,.04,M.wood,0,1.28,-.065);
// Sade ve simetrik pervaz. Duvar yüzeyiyle aynı hizada.
box(scene,.07,2.62,.18,M.wood,-.62,1.31,3.88);
box(scene,.07,2.62,.18,M.wood,.92,1.31,3.88);
box(scene,1.58,.08,.18,M.wood,.15,2.62,3.88);

const knob=new THREE.Mesh(
  new THREE.SphereGeometry(.055,8,6),
  mat(0xc7aa67)
);
knob.position.set(.48,1.25,-.12);
door.add(knob);

box(scene,7.7,.12,.09,M.dark,0,.06,-3.9);
box(scene,.09,.12,7.7,M.dark,-3.9,.06,0);
box(scene,.09,.12,7.7,M.dark,3.9,.06,0);

// PENCERE
box(scene,.1,1.75,2.35,M.dark,-3.87,1.95,-2);
box(scene,.04,1.52,2.12,mat(0x536782),-3.8,1.95,-2);
box(scene,.045,1.52,.045,M.metal,-3.76,1.95,-2);
box(scene,.045,.045,2.12,M.metal,-3.76,1.95,-2);

for(let i=0;i<7;i++){
  box(scene,.1,1.85,.34,M.curtain,-3.66,1.92,-3.12+i*.38);
}

box(scene,.12,.1,2.65,M.dark,-3.68,2.91,-2);

// HALI
box(scene,4.75,.035,3.65,M.dark,-.2,.018,.25);
box(scene,4.6,.045,3.5,M.carpet,-.2,.045,.25);

const pattern=mat(0x59483c);
for(let i=0;i<11;i++){
  box(scene,.035,.008,3.15,pattern,-2.35+i*.43,.072,.25);
}

box(scene,4.35,.01,.045,M.wood,-.2,.075,-1.5);
box(scene,4.35,.01,.045,M.wood,-.2,.075,2.0);

// YATAK
const bed=group(scene,-2.625,0,-2.2);

for(const x of [-1.22,1.22]){
  for(const z of [-1.48,1.48]){
    box(bed,.16,.42,.16,M.dark,x,.21,z);
  }
}

box(bed,2.75,.28,3.35,M.dark,0,.45,0);
box(bed,2.65,.2,3.22,M.fabric,0,.67,0);
box(bed,2.57,.13,2.12,M.blanket,0,.82,.48);

const pillow=mat(0xd4cbbc);
box(bed,1,.18,.58,pillow,-.65,.84,-1.13);
box(bed,1,.18,.58,pillow,.65,.84,-1.13);

box(bed,2.9,1.25,.16,M.dark,0,.91,-1.72);
box(bed,2.68,.92,.05,M.wood,0,.91,-1.62);

// KOMODİN VE LAMBA
const nightstand=group(scene,-.72,0,-3.48);
box(nightstand,.95,.68,.78,M.wood,0,.38,0);
box(nightstand,1,.08,.83,M.dark,0,.75,0);
box(nightstand,.78,.23,.035,M.dark,0,.55,.405);

const drawerKnob=new THREE.Mesh(
  new THREE.SphereGeometry(.045,8,6),
  mat(0xc7aa67)
);
drawerKnob.position.set(0,.55,.45);
nightstand.add(drawerKnob);

box(scene,.3,.07,.3,M.dark,-.72,.83,-3.48);
box(scene,.07,.34,.07,M.metal,-.72,1.02,-3.48);

const shade=new THREE.Mesh(
  new THREE.ConeGeometry(.22,.3,8),
  mat(0xe2c18c)
);
shade.position.set(-.72,1.23,-3.48);
shade.rotation.x=Math.PI;
scene.add(shade);

// DUVAR DEKORU: Viego'nun Ruined King kılıcından esinlenen özgün fantastik kılıç.
// Son konumu yatak üzerindeki sol duvar, 45 derece açı.
const viegoSword=group(scene,-.72,2.12,-3.775);
const bladeShape=new THREE.Shape();
bladeShape.moveTo(-.075,-.02);
bladeShape.lineTo(-.105,.18);
bladeShape.lineTo(-.055,.72);
bladeShape.lineTo(0,1.02);
bladeShape.lineTo(.055,.72);
bladeShape.lineTo(.105,.18);
bladeShape.lineTo(.075,-.02);
bladeShape.closePath();
const bladeGeo=new THREE.ExtrudeGeometry(bladeShape,{depth:.035,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.012,bevelThickness:.012});
const blade=new THREE.Mesh(bladeGeo,mat(0x78958d,{metalness:.72,roughness:.28,emissive:0x102c29,emissiveIntensity:.45}));
blade.position.z=-.018;
viegoSword.add(blade);
// Kılıcın ortasındaki soluk yeşil enerji çizgisi.
const rune=box(viegoSword,.018,.72,.012,mat(0x7ed9b0,{emissive:0x286b52,emissiveIntensity:.8}),0,.43,.045);
// Kabza ve çapraz koruma.
box(viegoSword,.12,.22,.075,mat(0x202a28),0,-.16,0);
box(viegoSword,.075,.28,.08,mat(0x4a3930),0,-.31,0);
const guard=box(viegoSword,.62,.075,.10,mat(0x3c514b,{metalness:.65,roughness:.32}),0,-.045,.015);
guard.rotation.z=-.12;
const pommel=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),mat(0x6b8a7c,{metalness:.55,roughness:.3}));
pommel.position.set(0,-.48,.015);viegoSword.add(pommel);
// İki küçük duvar askı aparatı kılıcı duvara sabitler.
for(const y of [.22,.66]){
  const mount=box(viegoSword,.16,.055,.10,M.dark,0,y,-.055);
}

const lampLight=new THREE.PointLight(0xffce87,.9,4);
lampLight.position.set(-.72,1.15,-3.15);
scene.add(lampLight);

// KOLTUK: arka ve sag duvara yakin, uzatilmis uc kisilik koltuk.
const chair=group(scene,2.62,0,-3.34);
box(chair,2.42,.35,1.12,M.fabric,0,.45,0);
box(chair,2.42,.92,.22,M.fabric,0,.96,-.45);
box(chair,.22,.58,1.08,M.fabric,-1.10,.73,0);
box(chair,.22,.58,1.08,M.fabric,1.10,.73,0);
// Oturma minderleri.
for(const x of [-.72,0,.72]){
  box(chair,.72,.13,.82,M.fabric,x,.68,.08);
}

function makeTinyBubble(){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const ctx=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:0}));
  sprite.scale.set(1.05,.27,1);sprite.position.y=.62;
  return {sprite,canvas:c,ctx,texture:tex};
}
function drawTinyBubble(bubble,phrase){
  const c=bubble.canvas,ctx=bubble.ctx;ctx.clearRect(0,0,c.width,c.height);
  // Eskimiş saha notu görünümü: hafif yamuk kenar, yıpranmış kâğıt ve aceleyle yazılmış metin.
  ctx.save();ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=12;ctx.shadowOffsetY=5;
  ctx.fillStyle='rgba(29,29,24,.96)';ctx.strokeStyle='rgba(151,137,105,.92)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(18,13);ctx.lineTo(486,8);ctx.lineTo(501,25);ctx.lineTo(494,94);ctx.lineTo(476,108);ctx.lineTo(82,113);ctx.lineTo(64,105);ctx.lineTo(13,108);ctx.lineTo(19,84);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  ctx.strokeStyle='rgba(188,174,137,.28)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(32,22);ctx.lineTo(475,18);ctx.moveTo(30,98);ctx.lineTo(467,96);ctx.stroke();
  ctx.fillStyle='#d1c5a4';ctx.font='italic 27px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
  let text=phrase;if(ctx.measureText(text).width>430){while(text.length>4&&ctx.measureText(text+'…').width>430)text=text.slice(0,-1);text+='…';}
  ctx.save();ctx.translate(256,59);ctx.rotate((Math.random()-.5)*.018);ctx.fillText(text,0,0);ctx.restore();
  bubble.texture.needsUpdate=true;
}

function initAudio(){
  if(!audioContext){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      audioContext=new AC();
      audioContext.addEventListener?.('statechange',()=>{
        if(audioContext?.state==='suspended'&&started===false)return;
      });
    }
  }
  // GitHub Pages ve diger HTTPS barindirmalarda tarayicilar sesi ilk
  // kullanici etkilesimine kadar kilitleyebilir. OYNA tiklamasi bunu acar.
  if(audioContext?.state==='suspended'){
    const resumeResult=audioContext.resume();
    if(resumeResult?.catch)resumeResult.catch(()=>{});
  }
  return audioContext;
}

function typeSound(){
  if(!audioContext)return;
  const now=audioContext.currentTime;
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  const filter=audioContext.createBiquadFilter();
  const ominous=stalkerDialogueActive;
  osc.type=ominous?'square':'square';
  osc.frequency.setValueAtTime(ominous?260+Math.random()*110:1250+Math.random()*450,now);
  osc.frequency.exponentialRampToValueAtTime(ominous?75:500,now+(ominous?.075:.025));
  filter.type='lowpass';filter.frequency.setValueAtTime(ominous?950:4200,now);
  gain.gain.setValueAtTime(ominous?.095:.035,now);
  gain.gain.exponentialRampToValueAtTime(.001,now+(ominous?.095:.035));
  osc.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
  osc.start(now);osc.stop(now+(ominous?.10:.04));
  if(ominous&&Math.random()<.22){
    const clack=audioContext.createOscillator(),cg=audioContext.createGain();
    clack.type='triangle';clack.frequency.setValueAtTime(95+Math.random()*35,now+.025);
    clack.frequency.exponentialRampToValueAtTime(38,now+.11);
    cg.gain.setValueAtTime(.045,now+.025);cg.gain.exponentialRampToValueAtTime(.001,now+.12);
    clack.connect(cg);cg.connect(audioContext.destination);clack.start(now+.025);clack.stop(now+.13);
  }
}

function playWomanLaugh(){
  if(!audioContext)return;

  const now=audioContext.currentTime;
  const master=audioContext.createGain();

  master.gain.setValueAtTime(.0001,now);
  master.gain.linearRampToValueAtTime(.2,now+.15);
  master.gain.setValueAtTime(.2,now+2.2);
  master.gain.exponentialRampToValueAtTime(.0001,now+3.4);

  const delay=audioContext.createDelay();
  delay.delayTime.value=.24;

  const feedback=audioContext.createGain();
  feedback.gain.value=.24;

  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(master);
  master.connect(audioContext.destination);

  for(let i=0;i<8;i++){
    const t=now+i*.34;
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    const filter=audioContext.createBiquadFilter();

    osc.type=i%2?'triangle':'sawtooth';
    osc.frequency.setValueAtTime(420+(i%3)*65,t);
    osc.frequency.exponentialRampToValueAtTime(175+(i%2)*30,t+.24);

    filter.type='lowpass';
    filter.frequency.value=1050;

    gain.gain.setValueAtTime(.0001,t);
    gain.gain.linearRampToValueAtTime(.22,t+.045);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.3);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    gain.connect(delay);

    osc.start(t);
    osc.stop(t+.32);
  }
}

function playScream(){
  if(!audioContext)return;

  const now=audioContext.currentTime;
  const master=audioContext.createGain();
  const filter=audioContext.createBiquadFilter();

  filter.type='bandpass';
  filter.frequency.setValueAtTime(1450,now);
  filter.frequency.exponentialRampToValueAtTime(850,now+1.15);
  filter.Q.value=1.1;

  master.gain.setValueAtTime(.0001,now);
  master.gain.linearRampToValueAtTime(.9,now+.035);
  master.gain.setValueAtTime(.78,now+.18);
  master.gain.exponentialRampToValueAtTime(.0001,now+1.45);

  filter.connect(master);
  master.connect(audioContext.destination);

  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.type='sawtooth';
  osc.frequency.setValueAtTime(980,now);
  osc.frequency.exponentialRampToValueAtTime(320,now+.28);
  osc.frequency.linearRampToValueAtTime(760,now+.55);
  osc.frequency.exponentialRampToValueAtTime(240,now+1.4);

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.linearRampToValueAtTime(.95,now+.025);
  gain.gain.setValueAtTime(.9,now+.2);
  gain.gain.exponentialRampToValueAtTime(.0001,now+1.45);

  osc.connect(gain);
  gain.connect(filter);

  const lfo=audioContext.createOscillator();
  const lfoGain=audioContext.createGain();

  lfo.frequency.value=7;
  lfoGain.gain.value=45;
  lfo.connect(lfoGain);
  lfoGain.connect(osc.frequency);

  lfo.start(now);
  lfo.stop(now+1.46);
  osc.start(now);
  osc.stop(now+1.46);

  const noiseBuffer=audioContext.createBuffer(
    1,audioContext.sampleRate*1.4,audioContext.sampleRate
  );
  const data=noiseBuffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    data[i]=(Math.random()*2-1);
  }

  const noise=audioContext.createBufferSource();
  const ng=audioContext.createGain();
  const nf=audioContext.createBiquadFilter();

  noise.buffer=noiseBuffer;
  nf.type='bandpass';
  nf.frequency.value=1900;

  ng.gain.setValueAtTime(.0001,now);
  ng.gain.linearRampToValueAtTime(.24,now+.035);
  ng.gain.exponentialRampToValueAtTime(.0001,now+1.25);

  noise.connect(nf);
  nf.connect(ng);
  ng.connect(master);

  ng.gain.linearRampToValueAtTime(.34,now+.025);
  noise.start(now);
  noise.stop(now+1.4);
}

function showSubtitle(message){
  clearInterval(subtitleTimer);
  subtitle.innerHTML='';
  subtitle.classList.add('visible');

  let index=0;
  const characters=[...message];

  subtitleTimer=setInterval(()=>{
    if(index>=characters.length){
      clearInterval(subtitleTimer);
      return;
    }

    const char=characters[index];
    const span=document.createElement('span');

    span.className='subtitle-char';
    span.textContent=char===' '?' ':char;
    subtitle.appendChild(span);

    if(char!==' '&&char!=='.'&&char!==',')typeSound();
    index++;
  },42);

  clearTimeout(showSubtitle.hideTimer);

  showSubtitle.hideTimer=setTimeout(()=>{
    clearInterval(subtitleTimer);
    subtitle.classList.remove('visible');
  },Math.max(4500,message.length*42+2200));
}

function updateMushroomEffect(dt){
  if(mushroomUsed&&mushroomEffectTime>0){
    mushroomEffectTime=Math.max(0,mushroomEffectTime-dt);
    const t=10-mushroomEffectTime;
    camera.rotation.z=Math.sin(elapsed*2.4)*(.10+Math.sin(t*1.4)*.025);
    camera.rotation.x+=Math.sin(elapsed*1.8)*.0018;
    for(const person of tinyPeople){
      person.mesh.visible=true;
      person.mesh.rotation.y+=dt*person.spin;
      person.mesh.position.y=person.baseY+Math.abs(Math.sin(elapsed*5.2+person.phase))*.10;
      person.nextSpeech-=dt;
      if(person.nextSpeech<=0){
        let pick=Math.floor(Math.random()*tinyPhrases.length);
        if(pick===person.phraseIndex)pick=(pick+1+Math.floor(Math.random()*(tinyPhrases.length-1)))%tinyPhrases.length;
        person.phraseIndex=pick;drawTinyBubble(person.bubble,tinyPhrases[pick]);
        person.speechTime=1.7+Math.random()*1.5;person.bubble.sprite.visible=true;
        person.nextSpeech=2.2+Math.random()*3.8;
      }
      if(person.speechTime>0){
        person.speechTime-=dt;
        const fade=Math.min(1,person.speechTime/.35,(2.2-person.speechTime)/.25);
        person.bubble.sprite.material.opacity=Math.max(0,Math.min(1,fade));
        person.bubble.sprite.visible=person.bubble.sprite.material.opacity>.02;
      }else{person.bubble.sprite.visible=false;person.bubble.sprite.material.opacity=0;}
    }
    for(const puff of mushroomSmoke){
      puff.life+=dt;
      const a=puff.phase+t*1.9;
      puff.mesh.position.set(.55+Math.cos(a)*(.22+t*.09),.25+(puff.life%2.3)*.55,-3.34+Math.sin(a)*(.22+t*.09));
      puff.mesh.scale.setScalar(.7+(puff.life%2.3)*.45);
      puff.mesh.material.opacity=Math.max(0,.42-(puff.life%2.3)*.17);
      if(puff.life>2.3)puff.mesh.visible=false;
    }
    if(mushroomEffectTime===0){
      document.getElementById('mushroomTint').classList.remove('active');
      camera.rotation.z=0;
      for(const puff of mushroomSmoke)puff.mesh.visible=false;

const joy=document.getElementById('joystick');
const stick=document.getElementById('stick');

let joyId=null;
let joyX=0;
let joyY=0;

function resetJoy(){
  joyId=null;
  joyX=0;
  joyY=0;
  stick.style.left='43px';
  stick.style.top='43px';
}

function moveJoy(e){
  const r=joy.getBoundingClientRect();

  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);

  const max=43;
  const len=Math.hypot(dx,dy);

  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.left=(43+dx)+'px';
  stick.style.top=(43+dy)+'px';
}

joy.addEventListener('pointerdown',e=>{
  if(!started||movementLocked)return;
  e.preventDefault();
  joyId=e.pointerId;
  joy.setPointerCapture(e.pointerId);
  moveJoy(e);
});

joy.addEventListener('pointermove',e=>{
  if(e.pointerId===joyId)moveJoy(e);
});

joy.addEventListener('pointerup',e=>{
  if(e.pointerId===joyId)resetJoy();
});

joy.addEventListener('pointercancel',e=>{
  if(e.pointerId===joyId)resetJoy();
});

function backHash(x,z,salt=0){

}

  const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(BACK_CHUNK_SIZE,BACK_CHUNK_SIZE),ceilingMat);ceiling.rotation.x=Math.PI/2;ceiling.position.set(BACK_CHUNK_SIZE/2,4,BACK_CHUNK_SIZE/2);group.add(ceiling);
  const wallH=4,wallT=.34, colliders=[];
  // Her hücrenin kenarı dünya koordinatına göre belirlenir. Böylece chunk sınırlarında duvarlar devam eder.
  for(let ix=0;ix<BACK_CHUNK_CELLS;ix++)for(let iz=0;iz<BACK_CHUNK_CELLS;iz++){
    const gx=cx*BACK_CHUNK_CELLS+ix,gz=cz*BACK_CHUNK_CELLS+iz;
    const x=(ix+.5)*BACK_CELL,z=(iz+.5)*BACK_CELL;
    const edges=[
      // X yönündeki iki kenarı açık tut: her hücrede sonsuza uzanan bir geçiş kalır.
      {on:false,px:x-BACK_CELL/2,pz:z,hx:wallT/2,hz:BACK_CELL/2+wallT/2},
      {on:false,px:x+BACK_CELL/2,pz:z,hx:wallT/2,hz:BACK_CELL/2+wallT/2},
      {on:backHash(gx,gz,23)>.39,px:x,pz:z-BACK_CELL/2,hx:BACK_CELL/2+wallT/2,hz:wallT/2},
      {on:backHash(gx,gz+1,23)>.39,px:x,pz:z+BACK_CELL/2,hx:BACK_CELL/2+wallT/2,hz:wallT/2}
    ];
    for(let ei=0;ei<edges.length;ei++){const e=edges[ei];if(!e.on)continue;
      const horizontal=e.hx>e.hz;
      const wall=new THREE.Mesh(new THREE.BoxGeometry(horizontal?BACK_CELL+wallT:wallT,wallH,horizontal?wallT:BACK_CELL+wallT),wallMat);
      wall.position.set(e.px,wallH/2,e.pz);group.add(wall);
      colliders.push({x:cx*BACK_CHUNK_SIZE+e.px,z:cz*BACK_CHUNK_SIZE+e.pz,hx:e.hx+.18,hz:e.hz+.18});
      // Grafitiler yalnızca seyrek duvarlarda, koridor boyunca aralıklı görünür.
      if(backHash(gx,gz,91+ei)>.76){
        const idx=Math.floor(backHash(gx,gz,137+ei)*backGraffitiTexts.length);
        const graffiti=makeBackGraffiti(backGraffitiTexts[idx]);
        graffiti.position.set(e.px+(horizontal?0:(ei===0?-.2:.2)),2.05,e.pz+(horizontal?(ei===2?-.2:.2):0));

      }
    }
  }
  // Floresanların çoğu bozuk; yalnızca yaklaşık beşte biri yanar.
  for(let x=4;x<BACK_CHUNK_SIZE;x+=16)for(let z=4;z<BACK_CHUNK_SIZE;z+=16){
    const gx=cx*BACK_CHUNK_CELLS+Math.floor(x/BACK_CELL),gz=cz*BACK_CHUNK_CELLS+Math.floor(z/BACK_CELL);

    const light=new THREE.PointLight(0xffe9a0,.22,10);light.position.set(x,3.65,z);group.add(light);
  }

}
function updateBackroomsChunks(){
  const cx=Math.floor(player.x/BACK_CHUNK_SIZE),cz=Math.floor(player.z/BACK_CHUNK_SIZE),keep=new Set();
  for(let x=cx-2;x<=cx+2;x++)for(let z=cz-2;z<=cz+2;z++){const key=`${x},${z}`;keep.add(key);buildBackroomsChunk(x,z);}
  for(const [key,data] of backroomsChunks){if(keep.has(key))continue;
    backroomsScene.remove(data.group);data.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}});
    backroomsChunks.delete(key);

function riverPath(which,z){
  if(which===0)return Math.sin(z*.035)*19+Math.sin(z*.012)*9;
  if(which===1)return -31+Math.sin(z*.052+1.4)*8+Math.sin(z*.017)*5;

function addRiverSection(parent,cx,cz){
  // Üç farklı yatak biçimi. Her parça kıvrımın gerçek yönüne göre ayrı çizilir.
  const styles=[
    {id:0,width:2.25,color:0x18333d},
    {id:1,width:1.45,color:0x1b3942},
    {id:2,width:2.9,color:0x203b43}
  ];
  const z0=cz*CHUNK_SIZE, z1=z0+CHUNK_SIZE;
  for(const st of styles){
    const mid=(z0+z1)*.5;
    const xa=riverPath(st.id,z0), xb=riverPath(st.id,z1);
    // Dereyi tek bir dikdörtgen yerine çokgen şerit olarak üret.
    const points=[];
    const steps=6;
    for(let i=0;i<=steps;i++){
      const z=z0+(z1-z0)*i/steps, x=riverPath(st.id,z);
      const before=riverPath(st.id,z-.25), after=riverPath(st.id,z+.25);
      const dx=after-before, len=Math.hypot(dx,.5)||1;
      const nx=.5/len, nz=-dx/len;

    for(let i=steps;i>=0;i--){
      const z=z0+(z1-z0)*i/steps, x=riverPath(st.id,z);
      const before=riverPath(st.id,z-.25), after=riverPath(st.id,z+.25);
      const dx=after-before, len=Math.hypot(dx,.5)||1;
      const nx=.5/len, nz=-dx/len;
      points.push([x-nx*st.width/2,z-nz*st.width/2]);
    }
    const verts=[];
    points.forEach(([x,z])=>verts.push(x,-.045,z));
    const indices=[];for(let i=1;i<points.length-1;i++)indices.push(0,i,i+1);
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();
    const mat=new THREE.MeshBasicMaterial({color:st.color,transparent:true,opacity:.9,side:THREE.DoubleSide});
    parent.add(new THREE.Mesh(geo,mat));
    // Kıyı çizgisi suyun şeklini takip eder, ancak çarpışma alanına dahil değildir.
    const bankMat=new THREE.MeshBasicMaterial({color:0x42443a,transparent:true,opacity:.48,side:THREE.DoubleSide});
    for(const side of [-1,1]){
      const bankPoints=[];
      for(let i=0;i<=steps;i++){

        bankPoints.push(new THREE.Vector3(x+side*(st.width/2+.22),-.07,z));

  }
}

    const bx=ox+(rnd()-.5)*(CHUNK_SIZE-2),bz=oz+(rnd()-.5)*(CHUNK_SIZE-2);
    if(Math.hypot(bx,bz)<5.5)continue;
    if(lakeSites.some(l=>Math.hypot(bx-l.x,bz-l.z)<l.r+2.5))continue;
    if(buildingFootprints.some(b=>Math.hypot(bx-b.x,bz-b.z)<b.r+1.2))continue;
    if(trees.some(t=>Math.hypot(bx-t.x,bz-t.z)<2.8))continue;
    addForestBush(chunk,bx,bz,.65+rnd()*.55,rnd()*Math.PI*2);
  }
  // Ağaçların arasında kısa süre görünen, yavaşça yer değiştiren karanlık silüetler.
  if(rnd()<.82){
    const sx=ox+(rnd()-.5)*16,sz=oz+(rnd()-.5)*16;
    const nearTree=trees.some(t=>Math.hypot(sx-t.x,sz-t.z)<3.2);
    const nearBuilding=buildingFootprints.some(b=>Math.hypot(sx-b.x,sz-b.z)<b.r+2);
    const nearLake=lakeSites.some(l=>Math.hypot(sx-l.x,sz-l.z)<l.r+2);
    if(!nearTree&&!nearBuilding&&!nearLake&&Math.hypot(sx-player.x,sz-player.z)>9){
      addWanderingSilhouette(chunk,sx,sz,rnd,`${cx},${cz}`);
    }
  }
  if((Math.abs(cx*3+cz*7)%3)===0){
    const rx=ox+(rnd()-.5)*18, rz=oz+(rnd()-.5)*18;
    if(Math.hypot(rx,rz)>4.5&&!lakeSites.some(l=>Math.hypot(rx-l.x,rz-l.z)<l.r+2)){ 
      const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.25,0),rockMat);
      rock.position.set(rx,.42,rz); rock.scale.set(1.4,.65,1.1); chunk.add(rock);
      forestColliders.push({x:rx,z:rz,r:1.35,chunkKey:`${cx},${cz}`});
    }
  }
  villageSites.forEach((site,i)=>{if(Math.floor(site.x/CHUNK_SIZE)===cx&&Math.floor(site.z/CHUNK_SIZE)===cz)addVillage(chunk,site,i);});
  loneBuildingSites.forEach((site,i)=>{if(Math.floor(site.x/CHUNK_SIZE)===cx&&Math.floor(site.z/CHUNK_SIZE)===cz)addAbandonedHouse(chunk,site.x,site.z,1.25,30+i);});
  lakeSites.forEach(site=>{if(Math.floor(site.x/CHUNK_SIZE)===cx&&Math.floor(site.z/CHUNK_SIZE)===cz)addLake(chunk,site);});
  // Dereler kaldırıldı. Haritada yalnızca tek büyük göl bulunur.
  forestScene.add(chunk); forestChunks.set(`${cx},${cz}`,chunk);
}
function updateForestChunks(){
  const cx=Math.floor(player.x/CHUNK_SIZE), cz=Math.floor(player.z/CHUNK_SIZE);
  for(let x=cx-CHUNK_RADIUS;x<=cx+CHUNK_RADIUS;x++) for(let z=cz-CHUNK_RADIUS;z<=cz+CHUNK_RADIUS;z++){
    const key=`${x},${z}`; if(!forestChunks.has(key))makeForestChunk(x,z);
  }
  for(const [key,chunk] of forestChunks){
    const [x,z]=key.split(',').map(Number);
    if(Math.abs(x-cx)>CHUNK_RADIUS||Math.abs(z-cz)>CHUNK_RADIUS){
      forestScene.remove(chunk); forestChunks.delete(key);
      for(let i=forestColliders.length-1;i>=0;i--)if(forestColliders[i].chunkKey===key)forestColliders.splice(i,1);
      for(let i=forestSilhouettes.length-1;i>=0;i--)if(forestSilhouettes[i].chunkKey===key)forestSilhouettes.splice(i,1);
    }
  }
}

function updateFlashlightAnimation(dt){

const obstacles=[

  {minX:-4.05,maxX:-1.18,minZ:-3.95,maxZ:-.45},
  {minX:-1.25,maxX:-.19,minZ:-3.90,maxZ:-3.00},

  {minX:3.18,maxX:4.02,minZ:-.88,maxZ:3.92},
  // Bilgisayar masası ve ayakları. Etkileşim alanı masanın oda tarafında kalır.
  {minX:-2.72,maxX:-.72,minZ:2.72,maxZ:3.78},
  // Saksı ve bitki tabanı.

];

const playerRadius=.28;

function forestCollides(x,z){
  // Göl ve nehir suyu geçilemez. Oyuncu kıyıda durur.
  let inWater=false;
  for(const lake of lakeSites){if(Math.hypot(x-lake.x,z-lake.z)<lake.r-.25){inWater=true;break;}}
  // Dereler kaldırıldığı için yalnızca büyük göl suyu çarpışma oluşturur.
  if(inWater){
    const now=performance.now();
    if(now-waterBlockCount.lastAt>850){
      waterBlockCount.lastAt=now;waterBlockCount.value++;
      const message=waterMessageForCount(waterBlockCount.value);
      if(message)showSubtitle(message);
    }
    return true;
  }
  for(const o of forestColliders){
    const dx=x-o.x, dz=z-o.z;
    const min=o.r+playerRadius;
    if(dx*dx+dz*dz<min*min)return true;
  }
  return false;
}

function collides(x,z){
  for(const o of obstacles){
    if(
      x+playerRadius>o.minX&&
      x-playerRadius<o.maxX&&
      z+playerRadius>o.minZ&&
      z-playerRadius<o.maxZ
    ){
      return true;
    }
  }
  return false;
}

// HAREKET
function updateMovement(dt){
  if(!started||movementLocked||sleeping||sleepAnimation||waking)return;

  let forward=0;
  let side=0;

  if(keys.KeyW)forward++;
  if(keys.KeyS)forward--;
  if(keys.KeyD)side++;
  if(keys.KeyA)side--;

  forward-=joyY;
  side+=joyX;

  const length=Math.hypot(forward,side);

  if(length>1){
    forward/=length;
    side/=length;
  }

  const crouching=!!keys.KeyC;
  crouchAmount=THREE.MathUtils.damp(crouchAmount,crouching?1:0,9,dt);
  const sprintRequested=keys.ShiftLeft||keys.ShiftRight;
  const actuallySprinting=sprintRequested&&stamina>0&&!crouching;
  const speed=(actuallySprinting?4.2:player.speed)*(crouching?.48:1);

  const dx=(
    -Math.sin(player.yaw)*forward+
    Math.cos(player.yaw)*side
  )*speed*dt;

  const dz=(
    -Math.cos(player.yaw)*forward-
    Math.sin(player.yaw)*side
  )*speed*dt;

  if(forestActive){
    const nextX=player.x+dx, nextZ=player.z+dz;
    if(!forestCollides(nextX,player.z))player.x=nextX;
    if(!forestCollides(player.x,nextZ))player.z=nextZ;
    updateForestChunks();
  }else if(backroomsActive){
    const nextX=player.x+dx,nextZ=player.z+dz;
    const blocked=(x,z)=>backroomsColliders.some(c=>Math.abs(x-c.x)<c.hx+.28&&Math.abs(z-c.z)<c.hz+.28);
    if(!blocked(nextX,player.z))player.x=nextX;
    if(!blocked(player.x,nextZ))player.z=nextZ;
    updateBackroomsChunks();
  }else{
    const nextX=THREE.MathUtils.clamp(player.x+dx,-3.65,3.65);
    const nextZ=THREE.MathUtils.clamp(player.z+dz,-3.65,3.65);
    if(!collides(nextX,player.z))player.x=nextX;
    if(!collides(player.x,nextZ))player.z=nextZ;
  }

  const moving=length>.04;
  if(moving){
    locomotionPhase+=dt*(actuallySprinting?13.5:8.2);
    const targetBob=Math.sin(locomotionPhase*2)*(actuallySprinting?.075:.032);
    cameraBob=THREE.MathUtils.damp(cameraBob,targetBob,actuallySprinting?13:10,dt);
  }else{
    cameraBob=THREE.MathUtils.damp(cameraBob,0,8,dt);
  }
  camera.position.set(player.x,player.y+cameraBob-.72*crouchAmount,player.z);
  const runTilt=moving&&actuallySprinting?Math.sin(locomotionPhase)*.012:0;
  camera.rotation.set(player.pitch+runTilt,player.yaw,0,'YXZ');
}

function updateSleep(dt){
  if(sleepAnimation){
    animationTime+=dt;

    const t=THREE.MathUtils.smoothstep(animationTime/2.2,0,1);

    // Yatağın üst yüzeyine göre konum
    const targetX=-2.625;
    const targetZ=-2.2;
    const targetY=1.05;

    player.x=THREE.MathUtils.lerp(sleepStartX,targetX,t);
    player.z=THREE.MathUtils.lerp(sleepStartZ,targetZ,t);
    player.y=THREE.MathUtils.lerp(1.65,targetY,t);

    player.yaw=THREE.MathUtils.lerp(sleepStartYaw,Math.PI/2,t);
    player.pitch=THREE.MathUtils.lerp(sleepStartPitch,1.25,t);

    camera.position.set(player.x,player.y,player.z);
    camera.rotation.set(player.pitch,player.yaw,0,'YXZ');

    if(animationTime>=2.2){
      sleepAnimation=false;
      sleeping=true;
      sleepTime=0;
      hint.textContent='UYUYORSUN...';
    }
  }

  if(sleeping){
    sleepTime+=dt;

    if(sleepTime>5&&!scareTriggered){
      triggerScare();
    }

    if(sleepTime>9){
      sleeping=false;
      enterForest();
      waking=true;
      animationTime=0;
      wakeStartYaw=player.yaw;
      wakeStartPitch=player.pitch;
      hint.textContent='UYANIYORSUN...';
    }
  }

  if(waking){
    animationTime+=dt;

    const t=THREE.MathUtils.smoothstep(animationTime/1.8,0,1);

    player.y=THREE.MathUtils.lerp(1.05,1.65,t);
    player.pitch=THREE.MathUtils.lerp(1.25,0,t);
    player.yaw=THREE.MathUtils.lerp(wakeStartYaw,Math.PI,t);

    camera.position.set(player.x,player.y,player.z);
    camera.rotation.set(player.pitch,player.yaw,0,'YXZ');

    if(animationTime>=1.8){
      waking=false;
      movementLocked=false;

      player.y=1.65;
      player.pitch=0;

      hint.textContent='WASD: İLERLE · SHIFT: KOŞ · C / CTRL: EĞİL · F: FENER';
      document.getElementById('flashlightBtn').style.display='block';

      camera.position.set(player.x,player.y,player.z);
      camera.rotation.set(0,player.yaw,0,'YXZ');
    }
  }
}

function updatePotHint(){
  if(!started||movementLocked||faceTriggered)return;

  if(nearPot()){
    hint.textContent='E / ETKİLEŞ: SAKSIYI SULA';
  }
}

// OYUN DÖNGÜSÜ
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.05);
  elapsed+=dt;
  const targetFov=zoomEnabled?zoomCameraFov:normalCameraFov;
  const nextFov=THREE.MathUtils.damp(camera.fov,targetFov,9,dt);
  if(Math.abs(camera.fov-nextFov)>.001){camera.fov=nextFov;camera.updateProjectionMatrix();}

  updateMovement(dt);
  updateBackroomsEncounter(dt);
  updateSurvivalHud(dt);
  updateMentalState(dt);
  updateSleep(dt);
  updateScare(dt);
  updatePot(dt);
  updatePlantJump(dt);
  updatePotHint();
  updateFlashlightAnimation(dt);
  updateForestSilhouettes(dt);
  updateStalkerEffects(dt);
  updateMushroomEffect(dt);

  renderer.render(backroomsActive?backroomsScene:(forestActive?forestScene:scene),camera);
}

// TELEFONU SALLAYINCA TAM EKRAN
let lastShakeAt=0;
let motionEnabled=false;
async function enableMotionShake(){
  try{
    if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      const permission=await DeviceMotionEvent.requestPermission();
      if(permission!=='granted')return;
    }
    if(motionEnabled)return;
    motionEnabled=true;
    window.addEventListener('devicemotion',e=>{
      const a=e.accelerationIncludingGravity;
      if(!a)return;
      const magnitude=Math.hypot(a.x||0,a.y||0,a.z||0);
      const now=Date.now();
      if(magnitude>23 && now-lastShakeAt>1800){
        lastShakeAt=now;
        const target=document.documentElement;
        if(!document.fullscreenElement){
          const request=target.requestFullscreen||target.webkitRequestFullscreen;
          if(request){try{const result=request.call(target);if(result&&result.catch)result.catch(()=>{});}catch(_){}}
        }
      }
    },{passive:true});
  }catch(_){}
}

// AÇILIŞ YÜKLEME EKRANI
const loadingStatus=document.getElementById('loadingStatus');
const playButton=document.getElementById('play');
const loadingMessages=[
  'Veriler alınıyor...',
  'Asetler yerleştiriliyor...',
  'Optimizasyon tamamlanıyor...',
  'Son kontroller yapılıyor...',
  'Oynamaya hazır!!'
];
let loadingStep=0;
loadingStatus.textContent=loadingMessages[0];
const loadingInterval=setInterval(()=>{
  loadingStep++;
  if(loadingStep<loadingMessages.length){
    loadingStatus.textContent=loadingMessages[loadingStep];
  }
  if(loadingStep>=loadingMessages.length-1){
    clearInterval(loadingInterval);
    playButton.classList.add('ready');
  }
},2500);

// BAŞLAT
document.getElementById('play').addEventListener('click',()=>{
  // Ses motorunu kullanicinin dogrudan tiklamasi sirasinda baslat.
  initAudio();
  started=true;
  enableMotionShake();
  document.getElementById('start').style.display='none';

  if(matchMedia('(pointer:fine)').matches){
    renderer.domElement.requestPointerLock?.();
  }
});

animate();

window.addEventListener('resize',()=>{
  renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix();
});
</script>
